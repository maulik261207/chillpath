services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://chillpath:chillpath@db:5432/chillpath
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chillpath
      POSTGRES_USER: chillpath
      POSTGRES_PASSWORD: chillpath
    ports:
      - "5432:5432"
    volumes:
      - chillpath_pgdata:/var/lib/postgresql/data

volumes:
  chillpath_pgdata:


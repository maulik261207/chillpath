[project]
name = "chillpath-backend"
version = "0.1.0"
description = "ChillPath cold-chain evidence and recovery backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "alembic>=1.14,<2",
  "httpx>=0.27,<1",
  "pyserial>=3.5,<4",
  "osmnx>=2.1,<3",
  "networkx>=3,<4",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend ci && npm --prefix frontend run build"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
